name: Build Dante Cast

# Versionamento INDEPENDENTE por app (tags separadas):
#   - push em main / workflow_dispatch  -> compila os dois (validação), sem publicar.
#   - tag  mac-v*                        -> compila e PUBLICA só o Release do macOS (.dmg).
#   - tag  android-v*                    -> compila e PUBLICA só o Release do Android (.apk).
on:
  push:
    branches: [ main ]
    tags: [ 'mac-v*', 'android-v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # macOS — roda em main, dispatch, ou tag mac-v*
  # ---------------------------------------------------------------------------
  macos:
    name: Build macOS (.dmg)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/mac-v')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && (xcodebuild -version || true)
      - name: Build DMG
        working-directory: app_mac
        run: |
          chmod +x build_dmg.sh
          ./build_dmg.sh
      - name: Verificar artefato
        working-directory: app_mac
        run: ls -lh DanteCast.dmg && file DanteCast.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: DanteCast-dmg
          path: app_mac/DanteCast.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android — roda em main, dispatch, ou tag android-v*
  # ---------------------------------------------------------------------------
  android:
    name: Build Android (.apk)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK debug (instalável garantido)
        working-directory: app_android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Build APK release (minificado/R8)
        id: release
        continue-on-error: true
        working-directory: app_android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Coletar APKs
        working-directory: app_android
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/DanteCast-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/DanteCast.apk
          else
            echo "release nao gerado — usando debug como DanteCast.apk"
            cp app/build/outputs/apk/debug/app-debug.apk out/DanteCast.apk
          fi
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: DanteCast-apk
          path: app_android/out/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release macOS — só em tag mac-v*
  # ---------------------------------------------------------------------------
  release-mac:
    name: Publicar Release (macOS)
    needs: [ macos ]
    if: startsWith(github.ref, 'refs/tags/mac-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: DanteCast-dmg, path: dist }
      - name: Criar Release (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#mac-v}"
          gh release create "${GITHUB_REF_NAME}" dist/DanteCast.dmg \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Dante Cast (macOS) v${VER}" \
            --notes "App macOS do Dante Cast — v${VER} (Apple Silicon, macOS 13+). Não assinado: no 1º uso, botão direito → Abrir. Veja o README/docs."

  # ---------------------------------------------------------------------------
  # Release Android — só em tag android-v*
  # ---------------------------------------------------------------------------
  release-android:
    name: Publicar Release (Android)
    needs: [ android ]
    if: startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: DanteCast-apk, path: dist }
      - name: Criar Release (Android)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#android-v}"
          gh release create "${GITHUB_REF_NAME}" dist/DanteCast.apk dist/DanteCast-debug.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Dante Cast (Android) v${VER}" \
            --notes "App Android do Dante Cast — v${VER}. Instale via sideload (Fontes desconhecidas). DanteCast-debug.apk é fallback. Veja o README/docs."
