# =====================================================================
# gradle.properties — flags globais do build
# =====================================================================

# Mais memória para o Gradle daemon (builds Compose podem ser pesados)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Builds em paralelo entre módulos
org.gradle.parallel=true

# Cache de configuração e build (acelera builds incrementais)
org.gradle.caching=true

# AndroidX (obrigatório para libs modernas)
android.useAndroidX=true

# Kotlin code style oficial
kotlin.code.style=official

# Gera apenas os recursos das classes R por módulo (build mais rápido/menor)
android.nonTransitiveRClass=true
